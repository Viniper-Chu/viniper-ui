name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_ref:
        description: "源码提交或分支（必须是已验收源码）"
        required: true
        default: "main"
        type: string
      target_release_tag:
        description: "要更新的既有 Release tag"
        required: true
        default: "v5.0.2"
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.target_release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-update-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build update package
        run: |
          VERSION="${RELEASE_TAG#v}"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^##\s+{re.escape(version)}[^\n]*\n(?P<body>.*?)(?=^##\s+v|\Z)"
          match = re.search(pattern, text, flags=re.M | re.S)
          notes = match.group("body").strip() if match else f"Viniper {version}"
          Path("dist").mkdir(exist_ok=True)
          Path("dist/release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
          NOTES="$(cat dist/release-notes.md)"
          python scripts/build_release.py --version "$VERSION" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          python scripts/verify_release.py

      - name: Upload update package
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir release-update
          cp "dist/Viniper-v${VERSION}.zip" release-update/
          cp dist/latest.json release-update/
          cp dist/release-notes.md release-update/
          test -s "release-update/Viniper-v${VERSION}.zip"

      - name: Store update package
        uses: actions/upload-artifact@v4
        with:
          name: update-package
          path: release-update/

  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Build Windows desktop installer
        shell: pwsh
        run: python scripts/build_desktop.py --target win

      - name: Stage exact Windows desktop installer
        shell: pwsh
        run: |
          $Version = $env:RELEASE_TAG.TrimStart("v")
          $Output = "release-windows"
          New-Item -ItemType Directory -Path $Output | Out-Null
          Copy-Item -LiteralPath "desktop/release/Viniper.Setup.$Version.exe" -Destination $Output
          Copy-Item -LiteralPath "desktop/release/Viniper.Setup.$Version.exe.blockmap" -Destination $Output
          if ((Get-Item -LiteralPath "$Output/Viniper.Setup.$Version.exe").Length -le 0) { throw "empty Windows installer" }
          if ((Get-Item -LiteralPath "$Output/Viniper.Setup.$Version.exe.blockmap").Length -le 0) { throw "empty Windows blockmap" }

      - name: Store Windows desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: release-windows/

  build-macos-desktop:
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Build macOS desktop package
        run: python scripts/build_desktop.py --target mac --arch "${{ matrix.arch }}"

      - name: Stage exact macOS desktop package
        run: |
          VERSION="${RELEASE_TAG#v}"
          OUTPUT="release-macos-${{ matrix.arch }}"
          mkdir "$OUTPUT"
          cp "desktop/release/Viniper.${VERSION}-${{ matrix.arch }}-mac.zip" "$OUTPUT/"
          cp "desktop/release/Viniper.${VERSION}-${{ matrix.arch }}-mac.zip.blockmap" "$OUTPUT/"
          test -s "$OUTPUT/Viniper.${VERSION}-${{ matrix.arch }}-mac.zip"
          test -s "$OUTPUT/Viniper.${VERSION}-${{ matrix.arch }}-mac.zip.blockmap"

      - name: Store macOS desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: release-macos-${{ matrix.arch }}/

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-update-package
      - build-windows-desktop
      - build-macos-desktop
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Finalize update manifest
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("release-artifacts")
          manifest_path = root / "latest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_TAG"].removeprefix("v")

          def required_asset(path):
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"required release asset missing or empty: {path}")
              return path

          def asset(path):
              return {
                  "name": path.name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{path.name}",
                  "size": path.stat().st_size,
              }

          assets = manifest.setdefault("assets", {})
          app = required_asset(root / f"Viniper-v{version}.zip")
          windows = required_asset(root / f"Viniper.Setup.{version}.exe")
          windows_map = required_asset(root / f"Viniper.Setup.{version}.exe.blockmap")
          macos_arm64 = required_asset(root / f"Viniper.{version}-arm64-mac.zip")
          macos_arm64_map = required_asset(root / f"Viniper.{version}-arm64-mac.zip.blockmap")
          macos_x64 = required_asset(root / f"Viniper.{version}-x64-mac.zip")
          macos_x64_map = required_asset(root / f"Viniper.{version}-x64-mac.zip.blockmap")
          if manifest.get("version") != version:
              raise SystemExit("latest.json version does not match the release tag")
          assets["app"] = asset(app)
          assets["installer_windows"] = asset(windows)
          assets["installer_macos"] = asset(macos_arm64)
          assets["installer_macos_arm64"] = asset(macos_arm64)
          assets["installer_macos_x64"] = asset(macos_x64)
          for key, path in (
              ("app", app),
              ("installer_windows", windows),
              ("installer_macos", macos_arm64),
              ("installer_macos_arm64", macos_arm64),
              ("installer_macos_x64", macos_x64),
          ):
              if assets[key] != asset(path):
                  raise SystemExit(f"latest.json {key} does not match the merged release asset")
          # Both blockmaps are required upload assets even though latest.json
          # describes only the user-facing installer files.
          _ = (windows_map, macos_arm64_map, macos_x64_map)
          manifest["published_at"] = datetime.now(timezone.utc).isoformat()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-artifacts/*
          name: Viniper ${{ env.RELEASE_TAG }}
          body_path: release-artifacts/release-notes.md
          make_latest: true
          overwrite_files: false
